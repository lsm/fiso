listenAddr: ":3500"
metricsAddr: ":9091"
targets:
  - name: api
    protocol: http
    host: backend-service
    port: 8080
    basePath: /api
    interceptors:
      - type: wasm
        config:
          module: /etc/fiso/modules/intercept.wasm
          runtime: wasmer
          env:
            INTERCEPT_MODE: "request-response"

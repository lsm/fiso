name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Run tests
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic \
            $(go list ./... | grep -v /cmd/ | grep -v /test/e2e/)

      - name: Run builder conformance tests
        # cmd/ is excluded from coverage above; ADR 0003 requires the builder
        # construction evidence to run in CI, including the Wasmer-tagged bins.
        run: |
          go test -count=1 ./cmd/fiso-flow/...
          go test -tags wasmer -count=1 \
            ./cmd/fiso-flow-wasmer/... ./cmd/fiso-wasmer-aio/... \
            ./cmd/fiso-wasmer/... ./cmd/fiso-wasmer-link/... \
            ./internal/wasmer/... ./internal/wasm/...

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ $(echo "$COVERAGE < 94.5" | bc) -eq 1 ]; then
            echo "FAIL: Coverage ${COVERAGE}% is below 94.5% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Run CLI tests
        run: go test -race ./internal/cli/...

      - name: Build fiso CLI
        run: go build -o bin\fiso.exe ./cmd/fiso

      - name: Smoke test
        shell: pwsh
        run: |
          $tmpDir = Join-Path $env:RUNNER_TEMP "fiso-smoke"
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null
          Push-Location $tmpDir
          & "$env:GITHUB_WORKSPACE\bin\fiso.exe" init --defaults
          if (-not (Test-Path "fiso\docker-compose.yml")) { throw "docker-compose.yml missing" }
          if (-not (Test-Path "fiso\flows\example-flow.yaml")) { throw "flow yaml missing" }
          if (-not (Test-Path "fiso\link\config.yaml")) { throw "link config missing" }
          if (-not (Test-Path "fiso\user-service\main.go")) { throw "user-service missing" }
          & "$env:GITHUB_WORKSPACE\bin\fiso.exe" validate
          Pop-Location

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0

      - name: golangci-lint (wasmer-tagged code)
        # Default tags hide every //go:build wasmer file from lint; run a
        # second pass so that surface is linted too.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: --build-tags=wasmer ./cmd/... ./internal/wasmer/... ./internal/wasm/...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "FAIL: The following files are not gofmt formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "FAIL: go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: Verify dependencies
        run: go mod verify

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          CGO_ENABLED=1 govulncheck -tags wasmer ./cmd/... ./internal/wasmer/... ./internal/wasm/...

  build:
    runs-on: ubuntu-latest
    needs: [test, test-windows, lint, checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Build all binaries
        run: |
          CGO_ENABLED=0 go build -o bin/fiso-flow ./cmd/fiso-flow
          CGO_ENABLED=0 go build -o bin/fiso-link ./cmd/fiso-link
          CGO_ENABLED=0 go build -o bin/fiso-operator ./cmd/fiso-operator
          CGO_ENABLED=0 go build -o bin/fiso ./cmd/fiso

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      kafka:
        image: apache/kafka:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Run integration tests
        run: go test -tags integration -race -timeout 120s ./test/integration/...
        env:
          KAFKA_BROKERS: localhost:9092

  cli-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Smoke test — fiso init + validate
        run: |
          chmod +x $GITHUB_WORKSPACE/bin/fiso
          cd $(mktemp -d)
          $GITHUB_WORKSPACE/bin/fiso init --defaults
          test -f fiso/docker-compose.yml
          test -f fiso/flows/example-flow.yaml
          test -f fiso/link/config.yaml
          test -f fiso/user-service/main.go
          grep -q "type: http" fiso/flows/example-flow.yaml
          grep -q "fiso-link" fiso/docker-compose.yml
          ! grep -q "kafka" fiso/flows/example-flow.yaml
          grep -q "profiles:" fiso/docker-compose.yml
          grep -q "localhost:3500" fiso/user-service/main.go
          ! test -d fiso/deploy
          $GITHUB_WORKSPACE/bin/fiso validate
          if $GITHUB_WORKSPACE/bin/fiso export > export.yaml 2> export.err; then
            echo "default local scaffold should not export lossily" >&2
            exit 1
          fi
          test ! -s export.yaml
          grep -q "source.type" export.err
          cat > fiso/flows/example-flow.yaml <<'EOF'
          name: example-flow
          source:
            type: grpc
            config:
              listenAddr: ":8081"
          sink:
            type: http
            config:
              url: http://user-service:8080/events
          EOF
          cat > fiso/link/config.yaml <<'EOF'
          targets:
            - name: user-service
              protocol: http
              host: user-service
          EOF
          $GITHUB_WORKSPACE/bin/fiso export > export.yaml
          grep -q "kind: FlowDefinition" export.yaml
          grep -q "kind: LinkTarget" export.yaml
          grep -q "apiVersion: fiso.io/v1alpha1" export.yaml
          grep -q "namespace: fiso-system" export.yaml

      - name: Doctor smoke test
        run: |
          cd $(mktemp -d)
          $GITHUB_WORKSPACE/bin/fiso init --defaults
          $GITHUB_WORKSPACE/bin/fiso doctor

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build Docker images from pre-compiled binaries
        run: |
          chmod +x bin/fiso-flow bin/fiso-link
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-link /usr/local/bin/fiso-link\nENTRYPOINT ["fiso-link"]\n' \
            | docker build -t fiso-link:e2e -f - bin/

      - name: Run HTTP E2E tests
        working-directory: test/e2e/http
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

      - name: Run multi-flow readiness E2E tests
        working-directory: test/e2e/multi-flow
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-kafka:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build Docker images from pre-compiled binaries
        run: |
          chmod +x bin/fiso-flow bin/fiso-link
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-link /usr/local/bin/fiso-link\nENTRYPOINT ["fiso-link"]\n' \
            | docker build -t fiso-link:e2e -f - bin/

      - name: Run Kafka E2E tests
        working-directory: test/e2e/kafka
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-kafka-temporal:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build Docker images from pre-compiled binaries
        run: |
          chmod +x bin/fiso-flow bin/fiso-link
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-link /usr/local/bin/fiso-link\nENTRYPOINT ["fiso-link"]\n' \
            | docker build -t fiso-link:e2e -f - bin/

      - name: Run Kafka → Temporal E2E tests
        working-directory: test/e2e/kafka-temporal
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-kafka-temporal-signal:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build Docker images from pre-compiled binaries
        run: |
          chmod +x bin/fiso-flow bin/fiso-link
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-link /usr/local/bin/fiso-link\nENTRYPOINT ["fiso-link"]\n' \
            | docker build -t fiso-link:e2e -f - bin/

      - name: Run Kafka → Temporal Signal E2E tests
        working-directory: test/e2e/kafka-temporal-signal
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-temporal-auth-oidc:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build Docker images from pre-compiled binaries
        run: |
          chmod +x bin/fiso-flow bin/fiso-link
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-link /usr/local/bin/fiso-link\nENTRYPOINT ["fiso-link"]\n' \
            | docker build -t fiso-link:e2e -f - bin/

      - name: Run Temporal OIDC Auth E2E tests
        working-directory: test/e2e/temporal-auth-oidc
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-wasm:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build Docker images from pre-compiled binaries
        run: |
          chmod +x bin/fiso-flow bin/fiso-link
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/

      - name: Build WASM module
        run: GOOS=wasip1 GOARCH=wasm go build -o test/e2e/wasm/module/enrich.wasm ./test/e2e/wasm/module/

      - name: Run WASM E2E tests
        working-directory: test/e2e/wasm
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  # ── Wasmer images, built once per run ───────────────────────────────────
  # Each wasmer E2E job used to let docker compose build its CGO image
  # in-job (apt llvm-dev + go mod download + CGO compile), so every CI run
  # paid the full wasmer toolchain cost four times. Build them once here
  # (with buildx layer caching keyed per image so unchanged sources skip
  # the CGO compile on later runs) and ship them as an artifact.
  wasmer-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the four wasmer images
        run: |
          set -e
          build() {
            docker buildx build \
              --cache-from "type=gha,scope=fiso-$1" \
              --cache-to "type=gha,scope=fiso-$1,mode=max" \
              --load -f "Dockerfile.$1" -t "fiso-$1:e2e" .
          }
          build wasmer
          build flow-wasmer
          build wasmer-link
          build wasmer-aio
          docker save fiso-wasmer:e2e fiso-flow-wasmer:e2e fiso-wasmer-link:e2e fiso-wasmer-aio:e2e \
            -o /tmp/wasmer-images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-images
          path: /tmp/wasmer-images.tar
          retention-days: 1

  e2e-flow-wasmer:
    runs-on: ubuntu-latest
    needs: [build, wasmer-images]
    steps:
      - uses: actions/checkout@v4

      - name: Load prebuilt wasmer images
        uses: actions/download-artifact@v4
        with:
          name: wasmer-images
          path: /tmp/wasmer-images/

      - name: Docker load
        run: docker load -i /tmp/wasmer-images/wasmer-images.tar

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Run Flow+Wasmer E2E tests
        working-directory: test/e2e/flow-wasmer
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-wasmer-link:
    runs-on: ubuntu-latest
    needs: [build, wasmer-images]
    steps:
      - uses: actions/checkout@v4

      - name: Load prebuilt wasmer images
        uses: actions/download-artifact@v4
        with:
          name: wasmer-images
          path: /tmp/wasmer-images/

      - name: Docker load
        run: docker load -i /tmp/wasmer-images/wasmer-images.tar

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Run Wasmer-Link E2E tests
        working-directory: test/e2e/wasmer-link
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-wasmer-aio:
    runs-on: ubuntu-latest
    needs: [build, wasmer-images]
    steps:
      - uses: actions/checkout@v4

      - name: Load prebuilt wasmer images
        uses: actions/download-artifact@v4
        with:
          name: wasmer-images
          path: /tmp/wasmer-images/

      - name: Docker load
        run: docker load -i /tmp/wasmer-images/wasmer-images.tar

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Run Wasmer-AIO E2E tests
        working-directory: test/e2e/wasmer-aio
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-wasmer-standalone:
    runs-on: ubuntu-latest
    needs: [build, wasmer-images]
    steps:
      - uses: actions/checkout@v4

      - name: Load prebuilt wasmer images
        uses: actions/download-artifact@v4
        with:
          name: wasmer-images
          path: /tmp/wasmer-images/

      - name: Docker load
        run: docker load -i /tmp/wasmer-images/wasmer-images.tar

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"

      - name: Run Wasmer Standalone E2E tests
        working-directory: test/e2e/wasmer-standalone
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-operator:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Install kind
        run: |
          [ -f /usr/local/bin/kind ] && exit 0
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run Operator E2E tests
        run: bash test/e2e/operator/test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-debezium:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build Docker images from pre-compiled binaries
        run: |
          chmod +x bin/fiso-flow bin/fiso-link
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-link /usr/local/bin/fiso-link\nENTRYPOINT ["fiso-link"]\n' \
            | docker build -t fiso-link:e2e -f - bin/

      - name: Run Debezium E2E tests
        working-directory: test/e2e/debezium
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  e2e-kafka-commit-policies:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/

      - name: Build fiso-flow Docker image from pre-compiled binary
        run: |
          chmod +x bin/fiso-flow
          printf 'FROM alpine:3.20\nRUN apk add --no-cache ca-certificates tzdata\nCOPY fiso-flow /usr/local/bin/fiso-flow\nENTRYPOINT ["fiso-flow"]\n' \
            | docker build -t fiso-flow:e2e -f - bin/

      - name: Run Kafka commit policies E2E tests
        working-directory: test/e2e/kafka-commit-policies
        run: bash test.sh
        env:
          E2E_BUILD_FLAG: " "

  # ── Single gate job ──────────────────────────────────────────────────────
  # Depends on every other CI job. Branch protection only needs to require
  # this one check instead of enumerating every job individually.
  all-tests-passing:
    runs-on: ubuntu-latest
    needs:
      - test
      - test-windows
      - lint
      - checks
      - build
      - integration
      - cli-smoke
      - e2e
      - e2e-kafka
      - e2e-kafka-temporal
      - e2e-kafka-temporal-signal
      - e2e-temporal-auth-oidc
      - e2e-wasm
      - wasmer-images
      - e2e-flow-wasmer
      - e2e-wasmer-link
      - e2e-wasmer-aio
      - e2e-wasmer-standalone
      - e2e-operator
      - e2e-debezium
      - e2e-kafka-commit-policies
    steps:
      - name: All CI jobs passed
        run: echo "All CI jobs passed."
